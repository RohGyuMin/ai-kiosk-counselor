<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3460"/><stop offset="1" stop-color="#0d2137"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="55" fill="#1abfaa" font-size="26" font-family="sans-serif" text-anchor="middle" font-weight="bold">진료과 안내</text>
  <!-- 내과 카드 -->
  <rect x="60" y="90" width="200" height="280" rx="16" fill="#0e9f8c" fill-opacity="0.15" stroke="#0e9f8c" stroke-width="2"/>
  <text x="160" y="130" fill="#1abfaa" font-size="20" font-family="sans-serif" text-anchor="middle" font-weight="bold">내과</text>
  <line x1="90" y1="145" x2="230" y2="145" stroke="#0e9f8c" stroke-width="1" opacity="0.5"/>
  <text x="160" y="175" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">감기 · 발열</text>
  <text x="160" y="200" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">소화기 질환</text>
  <text x="160" y="225" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">고혈압 · 당뇨</text>
  <text x="160" y="250" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">갑상선 질환</text>
  <text x="160" y="275" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">성인 만성질환</text>
  <!-- 가정의학과 카드 -->
  <rect x="300" y="90" width="200" height="280" rx="16" fill="#0e9f8c" fill-opacity="0.15" stroke="#0e9f8c" stroke-width="2"/>
  <text x="400" y="130" fill="#1abfaa" font-size="20" font-family="sans-serif" text-anchor="middle" font-weight="bold">가정의학과</text>
  <line x1="330" y1="145" x2="470" y2="145" stroke="#0e9f8c" stroke-width="1" opacity="0.5"/>
  <text x="400" y="175" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">건강검진</text>
  <text x="400" y="200" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">예방접종</text>
  <text x="400" y="225" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">금연 클리닉</text>
  <text x="400" y="250" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">비만 관리</text>
  <text x="400" y="275" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">전 연령 주치의</text>
  <!-- 소아청소년과 카드 -->
  <rect x="540" y="90" width="200" height="280" rx="16" fill="#0e9f8c" fill-opacity="0.15" stroke="#0e9f8c" stroke-width="2"/>
  <text x="640" y="130" fill="#1abfaa" font-size="20" font-family="sans-serif" text-anchor="middle" font-weight="bold">소아청소년과</text>
  <line x1="570" y1="145" x2="710" y2="145" stroke="#0e9f8c" stroke-width="1" opacity="0.5"/>
  <text x="640" y="175" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">영유아 검진</text>
  <text x="640" y="200" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">예방접종</text>
  <text x="640" y="225" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">소아 발열</text>
  <text x="640" y="250" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">성장 상담</text>
  <text x="640" y="275" fill="#e8f5f3" font-size="14" font-family="sans-serif" text-anchor="middle">만 18세 이하</text>
  <text x="400" y="460" fill="#e8f5f3" font-size="16" text-anchor="middle" font-family="sans-serif" opacity="0.7">담당 진료과가 궁금하시면 원무과에 문의해 주세요</text>
</svg>
