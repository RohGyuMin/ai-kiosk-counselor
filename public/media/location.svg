<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2f6e"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d8bd85" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#lbg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <text x="400" y="56" fill="#d8bd85" font-size="26" font-family="serif" text-anchor="middle">위치 안내</text>
  <text x="400" y="84" fill="#d8bd85" font-size="13" font-family="sans-serif" letter-spacing="6" text-anchor="middle" opacity="0.7">LOCATION · ACCESS</text>

  <!-- 지도 영역 -->
  <g transform="translate(100,120)">
    <rect width="600" height="320" rx="14" fill="#0b1733" stroke="#c8a86a" stroke-opacity="0.3"/>
    <!-- 도로 (가로/세로) -->
    <g stroke="#c8a86a" stroke-opacity="0.25" stroke-width="22" stroke-linecap="round">
      <line x1="40" y1="160" x2="560" y2="160"/>
      <line x1="220" y1="40" x2="220" y2="280"/>
      <line x1="420" y1="40" x2="420" y2="280"/>
    </g>
    <g stroke="#d8bd85" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6">
      <line x1="40" y1="160" x2="560" y2="160"/>
      <line x1="220" y1="40" x2="220" y2="280"/>
      <line x1="420" y1="40" x2="420" y2="280"/>
    </g>
    <!-- 건물 블록 -->
    <g fill="#1b2f6e" stroke="#c8a86a" stroke-opacity="0.15">
      <rect x="60" y="60" width="130" height="70"/>
      <rect x="60" y="190" width="130" height="70"/>
      <rect x="250" y="60" width="140" height="70"/>
      <rect x="250" y="190" width="140" height="70"/>
      <rect x="450" y="60" width="100" height="70"/>
      <rect x="450" y="190" width="100" height="70"/>
    </g>

    <!-- 지하철역 핀 (좌측) -->
    <g transform="translate(140,160)">
      <circle r="22" fill="#c8a86a"/>
      <circle r="22" fill="none" stroke="#d8bd85" stroke-width="2" opacity="0.5">
        <animate attributeName="r" from="22" to="40" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.5" to="0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text font-size="13" fill="#0b1733" text-anchor="middle" font-weight="700" y="5">M</text>
      <text font-size="13" fill="#f6f1e7" font-family="sans-serif" font-weight="600" y="-32" text-anchor="middle">합정역 3번 출구</text>
    </g>

    <!-- 의원 핀 (우측 — 큰 골드 핀) -->
    <g transform="translate(480,160)">
      <path d="M 0 -28 C -16 -28 -28 -16 -28 0 C -28 18 0 38 0 38 C 0 38 28 18 28 0 C 28 -16 16 -28 0 -28 Z" fill="#d8bd85" stroke="#0b1733" stroke-width="2"/>
      <circle r="10" fill="#0b1733"/>
      <path d="M -5 -2 H 5 V 2 H -5 Z M -1 -6 H 1 V 6 H -1 Z" fill="#d8bd85"/>
      <text font-size="13" fill="#d8bd85" font-family="serif" font-weight="600" y="-44" text-anchor="middle">한빛내과의원</text>
      <text font-size="11" fill="#f6f1e7" font-family="sans-serif" y="56" text-anchor="middle" opacity="0.8">한빛빌딩 3층</text>
    </g>

    <!-- 경로 점선 (역 → 의원) -->
    <path d="M 162 160 C 250 130 380 130 460 158" fill="none" stroke="#d8bd85" stroke-width="2" stroke-dasharray="4 6" opacity="0.7"/>
    <text x="310" y="115" fill="#d8bd85" font-size="13" font-family="sans-serif" text-anchor="middle" opacity="0.9">도보 2분</text>
  </g>

  <text x="400" y="478" fill="#f6f1e7" font-size="14" text-anchor="middle" font-family="sans-serif" opacity="0.6">
    서울시 마포구 합정로 123 한빛빌딩 3층 · 지하주차장 2시간 무료
  </text>
</svg>
