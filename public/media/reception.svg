<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122150"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
    <linearGradient id="rdesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f6e"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#rbg)"/>
  <text x="400" y="56" fill="#d8bd85" font-size="26" font-family="serif" text-anchor="middle">접수 안내</text>
  <text x="400" y="84" fill="#d8bd85" font-size="13" font-family="sans-serif" letter-spacing="6" text-anchor="middle" opacity="0.7">RECEPTION</text>

  <g font-family="sans-serif">
    <!-- 번호 디스플레이 (좌측) -->
    <g transform="translate(60,130)">
      <rect width="300" height="280" rx="14" fill="#0b1733" stroke="#c8a86a" stroke-opacity="0.4"/>
      <text x="150" y="44" fill="#d8bd85" font-size="14" letter-spacing="3" text-anchor="middle" opacity="0.7">NOW SERVING</text>
      <text x="150" y="148" fill="#d8bd85" font-size="100" font-family="serif" font-weight="700" text-anchor="middle">A-23</text>
      <line x1="40" y1="180" x2="260" y2="180" stroke="#c8a86a" stroke-opacity="0.3"/>
      <g fill="#f6f1e7" font-size="14" opacity="0.85">
        <text x="40" y="216">다음 번호</text>
        <text x="260" y="216" text-anchor="end" fill="#d8bd85">A-24, A-25</text>
        <text x="40" y="244">진료실</text>
        <text x="260" y="244" text-anchor="end" fill="#d8bd85">3진료실</text>
      </g>
    </g>

    <!-- 접수 방법 카드 (우측) -->
    <g transform="translate(400,130)">
      <rect width="340" height="280" rx="14" fill="url(#rdesk)" stroke="#c8a86a" stroke-opacity="0.4"/>
      <text x="22" y="40" fill="#d8bd85" font-size="14" letter-spacing="2">3가지 접수 방법</text>
      <line x1="22" y1="54" x2="318" y2="54" stroke="#c8a86a" stroke-opacity="0.3"/>

      <!-- 방법 1: 네이버 예약 -->
      <g transform="translate(22,76)">
        <circle cx="14" cy="14" r="14" fill="#c8a86a" opacity="0.18"/>
        <text x="14" y="19" fill="#d8bd85" font-size="13" font-weight="700" text-anchor="middle">N</text>
        <text x="42" y="14" fill="#f6f1e7" font-size="15" font-weight="600">네이버 예약</text>
        <text x="42" y="32" fill="#f6f1e7" font-size="12" opacity="0.7">사전 예약 · 시간 지정</text>
      </g>
      <!-- 방법 2: 똑닥 -->
      <g transform="translate(22,138)">
        <circle cx="14" cy="14" r="14" fill="#c8a86a" opacity="0.18"/>
        <rect x="6" y="6" width="16" height="16" rx="3" fill="none" stroke="#d8bd85" stroke-width="2"/>
        <text x="42" y="14" fill="#f6f1e7" font-size="15" font-weight="600">똑닥 앱</text>
        <text x="42" y="32" fill="#f6f1e7" font-size="12" opacity="0.7">당일 대기 등록</text>
      </g>
      <!-- 방법 3: 현장 키오스크 -->
      <g transform="translate(22,200)">
        <circle cx="14" cy="14" r="14" fill="#d8bd85"/>
        <path d="M 8 9 L 20 9 L 18 19 L 10 19 Z" fill="#0b1733"/>
        <text x="42" y="14" fill="#d8bd85" font-size="15" font-weight="700">현장 키오스크</text>
        <text x="42" y="32" fill="#f6f1e7" font-size="12" opacity="0.85">번호표 발급 · 즉시</text>
      </g>
    </g>
  </g>

  <text x="400" y="466" fill="#f6f1e7" font-size="13" text-anchor="middle" font-family="sans-serif" opacity="0.55">
    준비물 · 신분증 · 건강보험증(앱) · 기존 복용약 목록
  </text>
</svg>
