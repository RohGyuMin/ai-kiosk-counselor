<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2f6e"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
    <linearGradient id="dcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122150"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#dbg)"/>
  <text x="400" y="56" fill="#d8bd85" font-size="26" font-family="serif" text-anchor="middle">진료과 안내</text>
  <text x="400" y="84" fill="#d8bd85" font-size="13" font-family="sans-serif" letter-spacing="6" text-anchor="middle" opacity="0.7">DEPARTMENTS</text>

  <g font-family="sans-serif">
    <!-- 내과 -->
    <g transform="translate(60,130)">
      <rect width="220" height="290" rx="14" fill="url(#dcard)" stroke="#c8a86a" stroke-opacity="0.45"/>
      <g transform="translate(110,80)">
        <circle r="42" fill="#c8a86a" opacity="0.12"/>
        <circle r="42" fill="none" stroke="#d8bd85" stroke-width="2"/>
        <!-- 청진기 -->
        <path d="M -16 -16 V 4 C -16 14 -8 22 0 22 C 8 22 16 14 16 4 V -16" fill="none" stroke="#d8bd85" stroke-width="3" stroke-linecap="round"/>
        <circle cy="-20" cx="-16" r="3" fill="#d8bd85"/>
        <circle cy="-20" cx="16" r="3" fill="#d8bd85"/>
        <circle cy="28" r="6" fill="none" stroke="#d8bd85" stroke-width="3"/>
      </g>
      <text x="110" y="170" fill="#d8bd85" font-size="22" text-anchor="middle" font-weight="700" font-family="serif">내과</text>
      <line x1="40" y1="190" x2="180" y2="190" stroke="#c8a86a" stroke-opacity="0.3"/>
      <g fill="#f6f1e7" font-size="13" text-anchor="middle" opacity="0.85">
        <text x="110" y="218">감기 · 발열</text>
        <text x="110" y="240">소화기 · 복통</text>
        <text x="110" y="262">고혈압 · 당뇨</text>
      </g>
    </g>

    <!-- 가정의학과 -->
    <g transform="translate(290,130)">
      <rect width="220" height="290" rx="14" fill="url(#dcard)" stroke="#c8a86a" stroke-opacity="0.45"/>
      <g transform="translate(110,80)">
        <circle r="42" fill="#c8a86a" opacity="0.12"/>
        <circle r="42" fill="none" stroke="#d8bd85" stroke-width="2"/>
        <!-- 하트(주치의) -->
        <path d="M 0 16 C -16 4 -22 -8 -14 -16 C -8 -22 -2 -18 0 -10 C 2 -18 8 -22 14 -16 C 22 -8 16 4 0 16 Z" fill="#d8bd85"/>
      </g>
      <text x="110" y="170" fill="#d8bd85" font-size="22" text-anchor="middle" font-weight="700" font-family="serif">가정의학과</text>
      <line x1="40" y1="190" x2="180" y2="190" stroke="#c8a86a" stroke-opacity="0.3"/>
      <g fill="#f6f1e7" font-size="13" text-anchor="middle" opacity="0.85">
        <text x="110" y="218">건강검진</text>
        <text x="110" y="240">예방접종 · 금연</text>
        <text x="110" y="262">전 연령 주치의</text>
      </g>
    </g>

    <!-- 소아청소년과 -->
    <g transform="translate(520,130)">
      <rect width="220" height="290" rx="14" fill="url(#dcard)" stroke="#c8a86a" stroke-opacity="0.45"/>
      <g transform="translate(110,80)">
        <circle r="42" fill="#c8a86a" opacity="0.12"/>
        <circle r="42" fill="none" stroke="#d8bd85" stroke-width="2"/>
        <!-- 곰돌이/아이콘 (간단) -->
        <circle cx="0" cy="0" r="14" fill="none" stroke="#d8bd85" stroke-width="2.5"/>
        <circle cx="-12" cy="-12" r="6" fill="none" stroke="#d8bd85" stroke-width="2"/>
        <circle cx="12" cy="-12" r="6" fill="none" stroke="#d8bd85" stroke-width="2"/>
        <circle cx="-5" cy="-2" r="1.5" fill="#d8bd85"/>
        <circle cx="5" cy="-2" r="1.5" fill="#d8bd85"/>
        <path d="M -5 6 Q 0 10 5 6" fill="none" stroke="#d8bd85" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <text x="110" y="170" fill="#d8bd85" font-size="22" text-anchor="middle" font-weight="700" font-family="serif">소아청소년과</text>
      <line x1="40" y1="190" x2="180" y2="190" stroke="#c8a86a" stroke-opacity="0.3"/>
      <g fill="#f6f1e7" font-size="13" text-anchor="middle" opacity="0.85">
        <text x="110" y="218">영유아 검진</text>
        <text x="110" y="240">예방접종 · 발열</text>
        <text x="110" y="262">만 18세 이하</text>
      </g>
    </g>
  </g>

  <text x="400" y="466" fill="#f6f1e7" font-size="13" text-anchor="middle" font-family="sans-serif" opacity="0.55">
    내과 전문의 진료 · 전 연령 주치의 시스템
  </text>
</svg>
