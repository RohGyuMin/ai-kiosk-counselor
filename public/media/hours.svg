<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122150"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
    <linearGradient id="hcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f6e"/><stop offset="1" stop-color="#122150"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#hbg)"/>
  <text x="400" y="56" fill="#d8bd85" font-size="26" font-family="serif" text-anchor="middle">진료시간 안내</text>
  <text x="400" y="84" fill="#d8bd85" font-size="13" font-family="sans-serif" letter-spacing="6" text-anchor="middle" opacity="0.7">CLINIC HOURS</text>

  <!-- 큰 아날로그 시계 -->
  <g transform="translate(170,290)">
    <circle r="110" fill="#0b1733" stroke="#c8a86a" stroke-width="3"/>
    <circle r="110" fill="none" stroke="#d8bd85" stroke-width="1" opacity="0.3" stroke-dasharray="2 6"/>
    <g stroke="#d8bd85" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-100" x2="0" y2="-88"/>
      <line x1="100" y1="0" x2="88" y2="0"/>
      <line x1="0" y1="100" x2="0" y2="88"/>
      <line x1="-100" y1="0" x2="-88" y2="0"/>
    </g>
    <g stroke="#d8bd85" stroke-width="1.5" opacity="0.5">
      <line x1="50" y1="-86.6" x2="44" y2="-76.2"/>
      <line x1="86.6" y1="-50" x2="76.2" y2="-44"/>
      <line x1="86.6" y1="50" x2="76.2" y2="44"/>
      <line x1="50" y1="86.6" x2="44" y2="76.2"/>
      <line x1="-50" y1="86.6" x2="-44" y2="76.2"/>
      <line x1="-86.6" y1="50" x2="-76.2" y2="44"/>
      <line x1="-86.6" y1="-50" x2="-76.2" y2="-44"/>
      <line x1="-50" y1="-86.6" x2="-44" y2="-76.2"/>
    </g>
    <line x1="0" y1="0" x2="-44" y2="-30" stroke="#f6f1e7" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="32" y2="-70" stroke="#f6f1e7" stroke-width="3" stroke-linecap="round"/>
    <circle r="6" fill="#d8bd85"/>
    <text y="135" fill="#d8bd85" font-family="sans-serif" font-size="13" text-anchor="middle" letter-spacing="3">NOW OPEN</text>
  </g>

  <!-- 시간표 카드 -->
  <g transform="translate(330,150)">
    <rect width="380" height="240" rx="14" fill="url(#hcard)" stroke="#c8a86a" stroke-opacity="0.4"/>
    <g font-family="sans-serif" fill="#f6f1e7">
      <text x="24" y="44" font-size="15" fill="#d8bd85" letter-spacing="2">WEEKLY SCHEDULE</text>
      <line x1="24" y1="58" x2="356" y2="58" stroke="#c8a86a" stroke-opacity="0.3"/>
      <g font-size="18">
        <text x="24" y="92">평일 (월~금)</text>
        <text x="356" y="92" text-anchor="end" fill="#d8bd85" font-weight="600">09:00 – 18:00</text>
        <text x="24" y="128">토요일</text>
        <text x="356" y="128" text-anchor="end" fill="#d8bd85" font-weight="600">09:00 – 13:00</text>
        <text x="24" y="164" opacity="0.7">점심시간 (휴진)</text>
        <text x="356" y="164" text-anchor="end" opacity="0.7">13:00 – 14:00</text>
        <text x="24" y="200" opacity="0.5">일요일 · 공휴일</text>
        <text x="356" y="200" text-anchor="end" opacity="0.5">휴진</text>
      </g>
    </g>
  </g>

  <text x="400" y="450" fill="#f6f1e7" font-size="14" text-anchor="middle" font-family="sans-serif" opacity="0.5">
    당일 진료는 평일 17:00 이전 방문을 권장합니다
  </text>
</svg>
