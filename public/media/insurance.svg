<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2f6e"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
    <linearGradient id="icard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8bd85"/><stop offset="1" stop-color="#c8a86a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ibg)"/>
  <text x="400" y="56" fill="#d8bd85" font-size="26" font-family="serif" text-anchor="middle">보험 · 비용 안내</text>
  <text x="400" y="84" fill="#d8bd85" font-size="13" font-family="sans-serif" letter-spacing="6" text-anchor="middle" opacity="0.7">INSURANCE &amp; FEE</text>

  <g font-family="sans-serif">
    <!-- 건강보험증 카드 (좌측, 살짝 기울임) -->
    <g transform="translate(120,150) rotate(-4)">
      <rect width="280" height="170" rx="14" fill="url(#icard)" stroke="#0b1733" stroke-opacity="0.2"/>
      <text x="20" y="34" fill="#0b1733" font-size="12" letter-spacing="2" opacity="0.6">NATIONAL HEALTH INSURANCE</text>
      <text x="20" y="60" fill="#0b1733" font-size="20" font-weight="700" font-family="serif">건강보험증</text>
      <!-- 카드 칩 -->
      <rect x="20" y="80" width="36" height="28" rx="4" fill="#0b1733" opacity="0.85"/>
      <line x1="22" y1="88" x2="54" y2="88" stroke="#d8bd85" stroke-width="1" opacity="0.6"/>
      <line x1="22" y1="94" x2="54" y2="94" stroke="#d8bd85" stroke-width="1" opacity="0.6"/>
      <line x1="22" y1="100" x2="54" y2="100" stroke="#d8bd85" stroke-width="1" opacity="0.6"/>
      <text x="68" y="100" fill="#0b1733" font-size="14" font-weight="600">000-00-000000</text>
      <text x="20" y="138" fill="#0b1733" font-size="13" opacity="0.7">소지자</text>
      <text x="20" y="154" fill="#0b1733" font-size="15" font-weight="600">홍 길 동</text>
    </g>

    <!-- 비용 표 (우측) -->
    <g transform="translate(420,130)">
      <rect width="320" height="290" rx="14" fill="#0b1733" stroke="#c8a86a" stroke-opacity="0.4"/>
      <text x="22" y="40" fill="#d8bd85" font-size="14" letter-spacing="2">FEE GUIDE</text>
      <line x1="22" y1="54" x2="298" y2="54" stroke="#c8a86a" stroke-opacity="0.3"/>

      <g fill="#f6f1e7" font-size="15">
        <text x="22" y="86">초진료 (보험)</text>
        <text x="298" y="86" text-anchor="end" fill="#d8bd85" font-weight="600">약 1,500원</text>

        <text x="22" y="122">재진료 (보험)</text>
        <text x="298" y="122" text-anchor="end" fill="#d8bd85" font-weight="600">약 5,000원</text>

        <text x="22" y="158" opacity="0.75">건강검진 (비급여)</text>
        <text x="298" y="158" text-anchor="end" opacity="0.85">별도</text>

        <text x="22" y="194" opacity="0.75">예방접종</text>
        <text x="298" y="194" text-anchor="end" opacity="0.85">별도</text>

        <text x="22" y="230" opacity="0.75">비만 주사</text>
        <text x="298" y="230" text-anchor="end" opacity="0.85">별도</text>
      </g>
      <line x1="22" y1="248" x2="298" y2="248" stroke="#c8a86a" stroke-opacity="0.25"/>
      <text x="22" y="270" fill="#d8bd85" font-size="12" opacity="0.7">※ 산재 · 자동차보험 진료 가능</text>
    </g>
  </g>

  <text x="400" y="466" fill="#f6f1e7" font-size="13" text-anchor="middle" font-family="sans-serif" opacity="0.55">
    실비 청구용 영수증·진단서 발급 가능 (원무과 문의)
  </text>
</svg>
