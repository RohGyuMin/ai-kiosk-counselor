<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3460"/><stop offset="1" stop-color="#0d2137"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="55" fill="#1abfaa" font-size="26" font-family="sans-serif" text-anchor="middle" font-weight="bold">진료시간 안내</text>
  <!-- 시계 원 -->
  <circle cx="400" cy="210" r="110" fill="none" stroke="#0e9f8c" stroke-width="3"/>
  <circle cx="400" cy="210" r="6" fill="#1abfaa"/>
  <!-- 시계 눈금 -->
  <line x1="400" y1="108" x2="400" y2="120" stroke="#1abfaa" stroke-width="3"/>
  <line x1="400" y1="300" x2="400" y2="312" stroke="#0e9f8c" stroke-width="2"/>
  <line x1="292" y1="210" x2="304" y2="210" stroke="#0e9f8c" stroke-width="2"/>
  <line x1="496" y1="210" x2="508" y2="210" stroke="#0e9f8c" stroke-width="2"/>
  <!-- 시계 바늘 (9시 방향) -->
  <line x1="400" y1="210" x2="340" y2="175" stroke="#1abfaa" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="210" x2="400" y2="150" stroke="#e8f5f3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 진료시간 표 -->
  <rect x="60" y="345" width="680" height="130" rx="12" fill="#0e9f8c" fill-opacity="0.1" stroke="#0e9f8c" stroke-width="1.5"/>
  <text x="160" y="378" fill="#1abfaa" font-size="18" font-family="sans-serif" text-anchor="middle" font-weight="bold">평일</text>
  <text x="160" y="405" fill="#e8f5f3" font-size="16" font-family="sans-serif" text-anchor="middle">09:00 – 18:00</text>
  <line x1="270" y1="355" x2="270" y2="465" stroke="#0e9f8c" stroke-width="1" opacity="0.5"/>
  <text x="400" y="378" fill="#1abfaa" font-size="18" font-family="sans-serif" text-anchor="middle" font-weight="bold">토요일</text>
  <text x="400" y="405" fill="#e8f5f3" font-size="16" font-family="sans-serif" text-anchor="middle">09:00 – 13:00</text>
  <line x1="530" y1="355" x2="530" y2="465" stroke="#0e9f8c" stroke-width="1" opacity="0.5"/>
  <text x="640" y="378" fill="#1abfaa" font-size="18" font-family="sans-serif" text-anchor="middle" font-weight="bold">일요일/공휴일</text>
  <text x="640" y="405" fill="#e8f5f3" font-size="16" font-family="sans-serif" text-anchor="middle">휴진</text>
  <text x="400" y="445" fill="#1abfaa" font-size="14" font-family="sans-serif" text-anchor="middle" opacity="0.8">※ 점심시간 13:00 – 14:00 (진료 중단)</text>
</svg>
