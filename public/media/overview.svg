<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3460"/><stop offset="1" stop-color="#0d2137"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- 병원 건물 -->
  <rect x="250" y="140" width="300" height="260" rx="8" fill="none" stroke="#0e9f8c" stroke-width="3"/>
  <rect x="270" y="160" width="260" height="220" rx="4" fill="#0e9f8c" fill-opacity="0.08"/>
  <!-- 십자 로고 -->
  <rect x="375" y="80" width="50" height="14" rx="7" fill="#0e9f8c"/>
  <rect x="393" y="62" width="14" height="50" rx="7" fill="#0e9f8c"/>
  <!-- 창문 -->
  <rect x="290" y="185" width="45" height="40" rx="4" fill="#1abfaa" fill-opacity="0.3" stroke="#1abfaa" stroke-width="1.5"/>
  <rect x="355" y="185" width="45" height="40" rx="4" fill="#1abfaa" fill-opacity="0.3" stroke="#1abfaa" stroke-width="1.5"/>
  <rect x="420" y="185" width="45" height="40" rx="4" fill="#1abfaa" fill-opacity="0.3" stroke="#1abfaa" stroke-width="1.5"/>
  <rect x="290" y="245" width="45" height="40" rx="4" fill="#1abfaa" fill-opacity="0.3" stroke="#1abfaa" stroke-width="1.5"/>
  <rect x="355" y="245" width="45" height="40" rx="4" fill="#1abfaa" fill-opacity="0.3" stroke="#1abfaa" stroke-width="1.5"/>
  <rect x="420" y="245" width="45" height="40" rx="4" fill="#1abfaa" fill-opacity="0.3" stroke="#1abfaa" stroke-width="1.5"/>
  <!-- 출입구 -->
  <rect x="360" y="330" width="80" height="70" rx="4" fill="#0e9f8c" fill-opacity="0.2" stroke="#0e9f8c" stroke-width="2"/>
  <!-- 텍스트 -->
  <text x="400" y="52" fill="#1abfaa" font-size="26" font-family="sans-serif" text-anchor="middle" font-weight="bold">한빛내과의원</text>
  <text x="400" y="455" fill="#e8f5f3" font-size="18" text-anchor="middle" font-family="sans-serif" opacity="0.85">내과 · 가정의학과 · 소아청소년과</text>
  <text x="400" y="480" fill="#1abfaa" font-size="15" text-anchor="middle" font-family="sans-serif" opacity="0.7">합정역 3번 출구 도보 2분</text>
</svg>
