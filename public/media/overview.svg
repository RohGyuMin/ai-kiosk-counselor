<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2f6e"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
    <linearGradient id="obld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f6e"/><stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#obg)"/>
  <text x="400" y="56" fill="#d8bd85" font-size="26" font-family="serif" text-anchor="middle">한빛내과의원</text>
  <text x="400" y="84" fill="#d8bd85" font-size="13" font-family="sans-serif" letter-spacing="6" text-anchor="middle" opacity="0.7">SMART CLINIC · SINCE 2015</text>

  <!-- 건물 단면도 (5층) — 3층이 의원 -->
  <g transform="translate(260,130)">
    <rect width="280" height="290" fill="url(#obld)" stroke="#c8a86a" stroke-opacity="0.4"/>
    <!-- 옥상 -->
    <rect x="-12" y="-12" width="304" height="12" fill="#c8a86a" opacity="0.6"/>
    <!-- 각 층 구분선 + 라벨 -->
    <g font-family="sans-serif">
      <!-- 5층 -->
      <line x1="0" y1="58" x2="280" y2="58" stroke="#c8a86a" stroke-opacity="0.25"/>
      <text x="20" y="36" fill="#f6f1e7" font-size="13" opacity="0.55">5F</text>
      <g fill="#0b1733" opacity="0.4"><rect x="60" y="14" width="36" height="32"/><rect x="108" y="14" width="36" height="32"/><rect x="156" y="14" width="36" height="32"/><rect x="204" y="14" width="36" height="32"/></g>
      <text x="260" y="36" fill="#f6f1e7" font-size="11" text-anchor="end" opacity="0.55">사무실</text>

      <!-- 4층 -->
      <line x1="0" y1="116" x2="280" y2="116" stroke="#c8a86a" stroke-opacity="0.25"/>
      <text x="20" y="94" fill="#f6f1e7" font-size="13" opacity="0.55">4F</text>
      <g fill="#0b1733" opacity="0.4"><rect x="60" y="72" width="36" height="32"/><rect x="108" y="72" width="36" height="32"/><rect x="156" y="72" width="36" height="32"/><rect x="204" y="72" width="36" height="32"/></g>
      <text x="260" y="94" fill="#f6f1e7" font-size="11" text-anchor="end" opacity="0.55">치과</text>

      <!-- 3층 — 한빛내과의원 (강조) -->
      <rect y="116" width="280" height="58" fill="#c8a86a" opacity="0.16"/>
      <line x1="0" y1="174" x2="280" y2="174" stroke="#c8a86a" stroke-opacity="0.6"/>
      <text x="20" y="152" fill="#d8bd85" font-size="14" font-weight="700">3F</text>
      <g fill="#d8bd85" opacity="0.85"><rect x="60" y="130" width="36" height="32"/><rect x="108" y="130" width="36" height="32"/></g>
      <rect x="156" y="130" width="112" height="32" rx="4" fill="#0b1733" opacity="0.85"/>
      <text x="212" y="151" fill="#d8bd85" font-size="13" text-anchor="middle" font-weight="700">한빛내과의원</text>

      <!-- 2층 -->
      <line x1="0" y1="232" x2="280" y2="232" stroke="#c8a86a" stroke-opacity="0.25"/>
      <text x="20" y="210" fill="#f6f1e7" font-size="13" opacity="0.55">2F</text>
      <g fill="#0b1733" opacity="0.4"><rect x="60" y="188" width="36" height="32"/><rect x="108" y="188" width="36" height="32"/><rect x="156" y="188" width="36" height="32"/><rect x="204" y="188" width="36" height="32"/></g>
      <text x="260" y="210" fill="#f6f1e7" font-size="11" text-anchor="end" opacity="0.55">한빛약국</text>

      <!-- 1층 (입구) -->
      <text x="20" y="268" fill="#f6f1e7" font-size="13" opacity="0.55">1F</text>
      <rect x="60" y="240" width="50" height="50" fill="#0b1733" opacity="0.6"/>
      <rect x="116" y="240" width="36" height="50" fill="#0b1733" opacity="0.4"/>
      <rect x="158" y="240" width="36" height="50" fill="#0b1733" opacity="0.4"/>
      <rect x="200" y="240" width="40" height="50" fill="#0b1733" opacity="0.4"/>
      <text x="85" y="280" fill="#d8bd85" font-size="11" text-anchor="middle" opacity="0.9">입구</text>
      <text x="260" y="268" fill="#f6f1e7" font-size="11" text-anchor="end" opacity="0.55">로비 · 안내</text>
    </g>
  </g>

  <!-- 좌측 정보 -->
  <g transform="translate(60,160)" font-family="sans-serif">
    <text fill="#d8bd85" font-size="14" letter-spacing="3">SINCE</text>
    <text y="32" fill="#f6f1e7" font-size="32" font-weight="700" font-family="serif">2015</text>
    <text y="76" fill="#d8bd85" font-size="14" letter-spacing="3">DIRECTOR</text>
    <text y="100" fill="#f6f1e7" font-size="18" font-weight="600">김 한 빛 원장</text>
    <text y="120" fill="#f6f1e7" font-size="13" opacity="0.7">내과 전문의</text>
  </g>

  <!-- 우측 정보 -->
  <g transform="translate(580,160)" font-family="sans-serif">
    <text fill="#d8bd85" font-size="14" letter-spacing="3">DEPT</text>
    <text y="28" fill="#f6f1e7" font-size="14">내과</text>
    <text y="46" fill="#f6f1e7" font-size="14">가정의학과</text>
    <text y="64" fill="#f6f1e7" font-size="14">소아청소년과</text>
    <text y="106" fill="#d8bd85" font-size="14" letter-spacing="3">CALL</text>
    <text y="130" fill="#f6f1e7" font-size="16" font-weight="600">02-123-4567</text>
  </g>

  <text x="400" y="468" fill="#d8bd85" font-size="14" text-anchor="middle" font-family="serif" opacity="0.85" font-style="italic">
    가까운 곳에서, 믿을 수 있는 진료
  </text>
</svg>
